name: Offline sample tests
on:
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      nodejs: ${{ steps.plan.outputs.nodejs }}
      python: ${{ steps.plan.outputs.python }}
      java: ${{ steps.plan.outputs.java }}
      curl: ${{ steps.plan.outputs.curl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate catalog and change selection
        run: python3 -m unittest discover -s scripts/tests -v
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run:
          python3 scripts/ci-plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --output
          "$GITHUB_OUTPUT"
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
        if: needs.changes.outputs.nodejs == 'true'
      - run: python3 scripts/run-samples.py --language nodejs
        if: needs.changes.outputs.nodejs == 'true'
    needs: changes
    env:
      SAMPLE_IDS: ${{ needs.changes.outputs.selected }}
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
        if: needs.changes.outputs.python == 'true'
      - run: python3 scripts/run-samples.py --language python
        if: needs.changes.outputs.python == 'true'
    needs: changes
    env:
      SAMPLE_IDS: ${{ needs.changes.outputs.selected }}
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java:
          - "17"
          - "21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
        if: needs.changes.outputs.java == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
        if: needs.changes.outputs.java == 'true'
      - run: python3 scripts/run-samples.py --language java
        if: needs.changes.outputs.java == 'true'
    needs: changes
    env:
      SAMPLE_IDS: ${{ needs.changes.outputs.selected }}
  curl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
        if: needs.changes.outputs.curl == 'true'
      - run: python3 scripts/run-samples.py --language curl
        if: needs.changes.outputs.curl == 'true'
    needs: changes
    env:
      SAMPLE_IDS: ${{ needs.changes.outputs.selected }}
  ci:
    name: samples-ci
    runs-on: ubuntu-latest
    needs:
      - changes
      - javascript
      - python
      - java
      - curl
    if: always()
    steps:
      - name: Require planner and every runtime job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 - <<'PY'

          import json, os

          results = json.loads(os.environ['RESULTS'])

          failed = {name: job['result'] for name, job in results.items() if
          job['result'] != 'success'}

          if failed:
              raise SystemExit('Required sample jobs did not succeed: ' + str(failed))
          print('All selected samples passed; unaffected runtime steps were
          skipped.')

          PY
